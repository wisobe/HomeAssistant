blueprint:
  name: IKEA STYRBAR Remote (Matter) - Custom Light Control v0.4
  description: >
    Control a light using an IKEA STYRBAR remote via Matter.
    - Up Short: Toggle On
    - Up Long: Increase brightness by 25
    - Down Short: Toggle Off
    - Down Long: Decrease brightness by 25
    - Left Short: Cycle color temperature (warm → neutral → cold)
    - Right Short: Cycle color temperature (cold → neutral → warm)
  domain: automation
  input:
    matter_device:
      name: STYRBAR Remote
      selector:
        device:
          integration: matter
    light_entity:
      name: Light to Control
      selector:
        entity:
          domain: light

trigger:
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: up
    id: up_short
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_long_pressed
    subtype: up
    id: up_long
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: down
    id: down_short
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_long_pressed
    subtype: down
    id: down_long
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: left
    id: left_short
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: right
    id: right_short

variables:
  ct_values: [370, 250, 153]  # Warm, Neutral, Cold

action:
  - choose:
      - conditions:
          - condition: trigger
            id: up_short
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input light_entity

      - conditions:
          - condition: trigger
            id: up_long
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input light_entity
            data:
              brightness_step: 25

      - conditions:
          - condition: trigger
            id: down_short
        sequence:
          - service: light.turn_off
            target:
              entity_id: !input light_entity

      - conditions:
          - condition: trigger
            id: down_long
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input light_entity
            data:
              brightness_step: -25

      - conditions:
          - condition: trigger
            id: left_short
        sequence:
          - variables:
              current_ct: >
                {{ state_attr(light_entity, 'color_temp') or 250 }}
              index: >
                {{ (ct_values.index(current_ct) + 1) % ct_values | length if current_ct in ct_values else 0 }}
              next_ct: "{{ ct_values[index] }}"
          - service: light.turn_on
            target:
              entity_id: !input light_entity
            data:
              color_temp: "{{ next_ct }}"

      - conditions:
          - condition: trigger
            id: right_short
        sequence:
          - variables:
              current_ct: >
                {{ state_attr(light_entity, 'color_temp') or 250 }}
              index: >
                {{ (ct_values.index(current_ct) - 1) % ct_values | length if current_ct in ct_values else 0 }}
              prev_ct: "{{ ct_values[index] }}"
          - service: light.turn_on
            target:
              entity_id: !input light_entity
            data:
              color_temp: "{{ prev_ct }}"
  - default: []
