blueprint:
  name: IKEA STYRBAR Remote (Matter) - Default Light Control v0.3
  description: >
    Pre-configured blueprint that mimics original STYRBAR remote behavior:
    brightness control, toggling lights, etc.
  domain: automation
  input:
    matter_device:
      name: STYRBAR Remote
      selector:
        device:
          integration: matter
    light_target:
      name: Light to Control
      selector:
        target:
          entity:
            domain: light

trigger:
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: up
    id: up_short
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_long_pressed
    subtype: up
    id: up_long
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: down
    id: down_short
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_long_pressed
    subtype: down
    id: down_long
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: left
    id: left_short
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: right
    id: right_short

action:
  - choose:
      - conditions:
          - condition: trigger
            id: up_short
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_step: 25

      - conditions:
          - condition: trigger
            id: up_long
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_step: 50

      - conditions:
          - condition: trigger
            id: down_short
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_step: -25

      - conditions:
          - condition: trigger
            id: down_long
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_step: -50

      - conditions:
          - condition: trigger
            id: left_short
        sequence:
          - service: light.turn_off
            target: !input light_target

      - conditions:
          - condition: trigger
            id: right_short
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: 100
  - default: []
