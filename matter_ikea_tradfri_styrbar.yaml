blueprint:
  name: IKEA STYRBAR Remote (Matter) - Custom Light Control (Fixed) v0.5
  description: >
    Control a light using an IKEA STYRBAR remote via Matter.
    - Up Short: Toggle On
    - Up Long: Increase brightness by 25
    - Down Short: Toggle Off
    - Down Long: Decrease brightness by 25
    - Left Short: Cycle color temp: Warm → Neutral → Cold
    - Right Short: Cycle color temp: Cold → Neutral → Warm
  domain: automation
  input:
    matter_device:
      name: STYRBAR Remote
      selector:
        device:
          integration: matter
    light_entity:
      name: Light to Control
      selector:
        entity:
          domain: light

trigger:
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: up
    id: up_short
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_long_pressed
    subtype: up
    id: up_long
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: down
    id: down_short
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_long_pressed
    subtype: down
    id: down_long
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: left
    id: left_short
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: right
    id: right_short

variables:
  ct_values: [370, 250, 153]  # Warm, Neutral, Cold

action:
  - choose:
      - conditions:
          - condition: trigger
            id: up_short
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input light_entity

      - conditions:
          - condition: trigger
            id: up_long
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input light_entity
            data:
              brightness_step: 25

      - conditions:
          - condition: trigger
            id: down_short
        sequence:
          - service: light.turn_off
            target:
              entity_id: !input light_entity

      - conditions:
          - condition: trigger
            id: down_long
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input light_entity
            data:
              brightness_step: -25

      - conditions:
          - condition: trigger
            id: left_short
        sequence:
          - variables:
              current_ct: "{{ state_attr(light_entity, 'color_temp') or 250 }}"
              index: >
                {% set idx = ct_values.index(current_ct | int(default=250)) if current_ct | int in ct_values else 0 %}
                {{ (idx + 1) % ct_values | length }}
              next_ct: "{{ ct_values[index] }}"
          - service: light.turn_on
            target:
              entity_id: !input light_entity
            data:
              color_temp: !lambda next_ct

      - conditions:
          - condition: trigger
            id: right_short
        sequence:
          - variables:
              current_ct: "{{ state_attr(light_entity, 'color_temp') or 250 }}"
              index: >
                {% set idx = ct_values.index(current_ct | int(default=250)) if current_ct | int in ct_values else 0 %}
                {{ (idx - 1) % ct_values | length }}
              prev_ct: "{{ ct_values[index] }}"
          - service: light.turn_on
            target:
              entity_id: !input light_entity
            data:
              color_temp: !lambda prev_ct

  - default: []
