blueprint:
  name: IKEA STYRBAR Remote (Matter) - Custom Light Control (Working) v0.6
  description: >
    Control a light using IKEA STYRBAR remote via Matter.
    - Up Short: Turn on
    - Up Long: Brightness +25
    - Down Short: Turn off
    - Down Long: Brightness -25
    - Left Short: Cycle color temp: warm → neutral → cold
    - Right Short: Cycle color temp: cold → neutral → warm
  domain: automation
  input:
    matter_device:
      name: STYRBAR Remote
      selector:
        device:
          integration: matter
    light_entity:
      name: Light to Control
      selector:
        entity:
          domain: light

trigger:
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: up
    id: up_short
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_long_pressed
    subtype: up
    id: up_long
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: down
    id: down_short
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_long_pressed
    subtype: down
    id: down_long
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: left
    id: left_short
  - platform: device
    device_id: !input matter_device
    domain: matter
    type: button_pressed
    subtype: right
    id: right_short

variables:
  light: !input light_entity
  ct_warm: 370
  ct_neutral: 250
  ct_cold: 153

action:
  - choose:
      - conditions:
          - condition: trigger
            id: up_short
        sequence:
          - service: light.turn_on
            target:
              entity_id: "{{ light }}"

      - conditions:
          - condition: trigger
            id: up_long
        sequence:
          - service: light.turn_on
            target:
              entity_id: "{{ light }}"
            data:
              brightness_step: 25

      - conditions:
          - condition: trigger
            id: down_short
        sequence:
          - service: light.turn_off
            target:
              entity_id: "{{ light }}"

      - conditions:
          - condition: trigger
            id: down_long
        sequence:
          - service: light.turn_on
            target:
              entity_id: "{{ light }}"
            data:
              brightness_step: -25

      - conditions:
          - condition: trigger
            id: left_short
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(light, 'color_temp') | int == ct_warm }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ light }}"
                    data:
                      color_temp: "{{ ct_neutral }}"
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(light, 'color_temp') | int == ct_neutral }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ light }}"
                    data:
                      color_temp: "{{ ct_cold }}"
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(light, 'color_temp') | int == ct_cold }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ light }}"
                    data:
                      color_temp: "{{ ct_warm }}"
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(light, 'color_temp') is none }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ light }}"
                    data:
                      color_temp: "{{ ct_neutral }}"

      - conditions:
          - condition: trigger
            id: right_short
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(light, 'color_temp') | int == ct_cold }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ light }}"
                    data:
                      color_temp: "{{ ct_neutral }}"
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(light, 'color_temp') | int == ct_neutral }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ light }}"
                    data:
                      color_temp: "{{ ct_warm }}"
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(light, 'color_temp') | int == ct_warm }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ light }}"
                    data:
                      color_temp: "{{ ct_cold }}"
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(light, 'color_temp') is none }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ light }}"
                    data:
                      color_temp: "{{ ct_neutral }}"
  - default: []
